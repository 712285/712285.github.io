<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты - Сабрина Ермальчук</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }

        .header {
            background: linear-gradient(to right, #8a2be2, #4b0082);
            color: white;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .nav {
            background-color: #6a0dad;
            padding: 10px 0;
        }

        .nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nav li {
            margin: 0 15px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .nav a:hover, .nav a.active {
            background-color: #ffd700;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 0;
        }

        .main-title {
            text-align: center;
            color: #4b0082;
            margin: 30px 0;
            font-size: 28px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .info-box {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            margin: 20px 0;
            border-left: 5px solid #8a2be2;
        }

        .contact-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin: 30px 0;
        }

        .contact-info, .contact-form {
            flex: 1;
            min-width: 300px;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .contact-icon {
            color: #8a2be2;
            font-size: 24px;
            width: 40px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #4b0082;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .form-group textarea {
            height: 150px;
            resize: vertical;
        }

        .submit-btn {
            background-color: #8a2be2;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }

        .submit-btn:hover {
            background-color: #4b0082;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .social-icon {
            display: inline-block;
            width: 50px;
            height: 50px;
            background-color: #8a2be2;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 50px;
            font-size: 24px;
            transition: all 0.3s;
            text-decoration: none;
        }

        .social-icon:hover {
            background-color: #4b0082;
            transform: scale(1.1);
        }

        .footer {
            background-color: #4b0082;
            color: white;
            text-align: center;
            padding: 20px 0;
            margin-top: 40px;
        }

        .photo-section {
            text-align: center;
            margin: 30px 0;
        }

        .photo-section img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .nav ul {
                flex-direction: column;
                align-items: center;
            }

            .nav li {
                margin: 5px 0;
            }

            .contact-container {
                flex-direction: column;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="header">
        <h1>Сабрина Ермальчук</h1>
        <p>Танцовщица и студентка из Томска</p>
    </div>

    <div class="nav">
        <ul>
            <li><a href="index.html">Главная</a></li>
            <li><a href="about.html">Обо мне</a></li>
            <li><a href="dance.html">Танцы</a></li>
            <li><a href="contact.html" class="active">Контакты</a></li>
        </ul>
    </div>

    <div class="container">
        <h1 class="main-title">Свяжитесь со мной</h1>

        <div class="photo-section">
            <img src="contact.jpg" alt="Сабрина на выступлении" style="max-width: 400px;">
            <p>Я всегда рада новым знакомствам и предложениям о сотрудничестве!</p>
        </div>

        <div class="contact-container">
            <div class="contact-info">
                <h2 style="color: #4b0082; margin-bottom: 25px;">Мои контакты</h2>
